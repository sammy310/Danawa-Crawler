# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Auto Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  issues: write

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Crawler
      id: crawler
      continue-on-error: true
      run: |
        python danawa_crawler.py
      env:
        MY_GITHUB_TOKEN: ${{ github.token }}
    - name: Commits
      run: |
        git config --local user.email "kipper098@gmail.com"
        git config --local user.name "Auto_Crawler_Bot"
        git add --all
        if git diff --cached --quiet; then
          echo "No crawl data changes to commit"
        else
          git commit -m "Bot - Auto Crawl | $(date -d '+9 hour' +'%Y-%m-%d %H:%M:%S')"
        fi
    - name: Push
      uses: ad-m/github-push-action@master
      with:
        branch: 'master'
        github_token: ${{ github.token }}
    - name: Mark crawler failure
      if: steps.crawler.outcome == 'failure'
      run: |
        echo "One or more crawl categories failed."
        exit 1
